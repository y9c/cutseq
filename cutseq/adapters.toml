[DBITSEQ]
scheme = "AAGCAGTGGTATCAACGCAGAGTGAATGGG...GGG-N12AGTCGTACGCCGATGCGAAACATCGGCCACN8CGAATGCTCTGGCCTCTCAAGCACGTGGATN8AGATGCGAGAAGCCAACGCTTG"
description_name = "DBiT-seq (spatial RNA, 50x50 barcode grid)"
points = [
  "DBiT-seq: deterministic barcoding in tissue (Liu et al., Cell 2020),",
  "spatial RNA with a 50x50 grid: each pixel is barcodeA + barcodeB,",
  "8 nt each, plus a 12-nt UMI for duplicate removal.",
  "R1: TSO + cDNA; the barcode arm is on R2 (written in rc form after ':'),",
  "per the molecule's 5'->3' order.",
  "R1's read 5' scaffold is the TSO (template-switch oligo; R1's first",
  "sequenced bases, downstream of the R1-primer site) and is what gets",
  "trimmed by the scheme's left tokens (S0 R1).",
  "A 5' poly-G / G-stretch right after the TSO is auto-detected and trimmed",
  "(leftmost-anchored): the left adapter covers the TSO(+GAAT) region and the",
  "relative GGG...GGG run trims any leading homopolymer - tunable with G<k>.",
  "The R1/R2 sequencing primers (TCGTCGGCAGCGTCAGATGTGTATAAGAGACAG and",
  "GTCTCGTGGGCTCGGAGATGTGTATAAGAGACAG) anneal UPSTREAM of each read; reads",
  "start downstream of them, so the primers are never part of the reads and",
  "are not trimmed. --r1-primer / --r2-primer are informational only.",
  "Full construct (5'->3'): P5 | i5(8) | R1-primer(34) | TSO(22) | insert |",
  "polyA/T | UMI(12) | rc(L1) | barcodeA(8) | rc(L2) | barcodeB(8) | rc(handle) |",
  "rc(R2-primer) | i7(8) | rc(P7).",
]

# m6A-ARTR-DBiT spatial (Nature Methods 2026 implementation). Same barcode
# cassette as DBITSEQ, but a 10-nt UMI (DBITSEQ's is 12 nt). Both are valid
# DBiT-style libraries; use -A M6AARTR for the 10-nt-UMI m6A-ARTR-DBiT batch
# and -A DBITSEQ for the 12-nt-UMI DBiT-seq batch.
[M6AARTR]
scheme = "AAGCAGTGGTATCAACGCAGAGTGAATGGG...GGGAAAA...A-N10AGTCGTACGCCGATGCGAAACATCGGCCACN8CGAATGCTCTGGCCTCTCAAGCACGTGGATN8AGATGCGAGAAGCCAACGCTTG"
description_name = "m6A-ARTR-DBiT (spatial RNA, 10-nt UMI)"
points = [
  "m6A-ARTR-DBiT: same spatial barcode cassette as DBiT-seq (handle ->",
  "barcodeB(8) -> linker2 -> barcodeA(8) -> linker1 on R2), but the UMI is",
  "10 nt (DBITSEQ's is 12 nt).",
  "R1: TSO + cDNA; the barcode+UMI arm is on R2 (written in rc form after ':',",
  "per the molecule's 5'->3' order).",
  "Recommended run for spatial demultiplexing:",
  "  cutseq -A M6AARTR -R '{id}_BC2:{3}_BC1:{2}_UMI:{1}'",
  "         --require-cassette -m 18 ...",
  "  (--require-cassette discards pairs whose R2 lacks the barcode cassette;",
  "  the scheme trims the R1 poly-A region natively so empty py-A reads fall",
  "  under --min-length and are dropped, no extra filter needed).",
]

