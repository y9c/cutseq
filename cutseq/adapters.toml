# Built-in adapter schemes for cutseq (new grammar format)
#
# Every scheme below is written in the space-free grammar:
#   ACGT..  adapter (uppercase)     -> match & trim
#   acgt..  inline barcode (lower)  -> match & capture
#   NNNNN   UMI capture -> into read name
#   XXXXXX  mask -> trim only
#   AAA...AAA   3'-poly-tail trim (homopolymer run); a run at a read start
#               (after the outer adapter/primer) is auto-detected as a 5'
#               leftmost-anchored poly-run trim (e.g. template-switch poly-G)
#   : + -   insert marker (unstranded / sense / antisense), splits R1 | R2
# Numeric shorthand (N5, X6) is accepted by the grammar but the built-ins use
# the full repeated-run form below for readability.
# A "legacy = true" flag marks a scheme carried over from the old fixed-slot
# format; it is stored here in the new grammar for reference.

# RNA library

[SMALLRNA]
scheme = "AGTTCTACAGTCCGACGATC+AGATCGGAAGAGCACACGTC"
legacy = true
description_name = "Small RNA Libraries"
points = [
  "Used for small RNA sequencing",
  "Double ligation method",
  "Forward orientation",
  "Optional 2nt trimming on both ends for quality",
]

