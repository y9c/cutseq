name: Deploy static docs site (no Jekyll)

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - 'docs/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Build job: docs/ is already fully static HTML (no Jekyll, no Ruby).
  # We simply publish the docs/ directory verbatim as the site root.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Strip any stray .md sources before upload
        # The site is fully static HTML; never hand pages/sources to GH Pages.
        run: rm -f docs/*.md
      - name: Upload static site artifact (docs/, verbatim)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
