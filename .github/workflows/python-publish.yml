name: Upload Python Package

on:
  push:
    branches: [main]          # version bump in pyproject.toml => build check
    tags: ['v*']              # explicit release tag => build + publish
  workflow_dispatch:          # manual publish

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the project and run tests
        run: |
          uv sync
          uv run pytest test/ -q
      - name: Build wheel + sdist
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    # Only publish on an explicit version tag (or manual dispatch). A trusted
    # publisher must be configured on PyPI for this repo + environment:
    #   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/cutseq
    permissions:
      id-token: write            # mandatory for trusted publishing (no API token)
    steps:
      - name: Download source distributions
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password/token: uses Trusted Publishing (github->PyPI OIDC).
        # Attestations (PEP 740) are generated & uploaded automatically.
        with:
          packages-dir: dist/
